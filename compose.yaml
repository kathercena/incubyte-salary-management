services:
  postgres:
    image: postgres:17
    container_name: incubyte-postgres
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_app -d salary_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
