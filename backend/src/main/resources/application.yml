spring:
  application:
    name: salary-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${SPRING_DATASOURCE_USERNAME:salary_app}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    hr-manager:
      username: ${HR_MANAGER_USERNAME}
      password: ${HR_MANAGER_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
